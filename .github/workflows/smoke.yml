name: Winkler prelaunch smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qa/**'
      - '.github/workflows/smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Exercise read-only live preview safety checks
        env:
          WM_SITE_URL: https://winkler-stripe-checkout-review.vercel.app
        run: node --test qa/live-prelaunch.test.mjs
